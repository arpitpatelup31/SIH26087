services:
  - type: web
    name: coopconnect-lms
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    disk:
      name: coopconnect-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1